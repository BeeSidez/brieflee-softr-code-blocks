<!-- NOT THE LIVE IMPLEMENTATION. The chips ship as a vibe block, one per page:
     see cta-chips-block.tsx. That version opens the demo modal centred and the
     chat as a right side panel, which the custom-code route does not do, and it
     leaves the app pages free for their own separate chips. Keep this file only
     as the custom-code reference. Do not paste it into Settings.
     =========================================================================== -->

<!-- ===========================================================================
     Brieflee floating CTA chips
     PASTE ONCE into: Settings > Custom Code > FOOTER  (whole site)

       Bottom left    "Book a demo"  -> /book-call     centred modal
       Bottom right   chat bubble    -> /book-a-demo   right side panel

     WHICH PAGES IT SHOWS ON
     Edit the PAGES list below. That is the only thing you ever need to touch
     to add or remove a page. Everything else stays as it is.
       - add a page      add its path to the list, e.g. '/case-studies'
       - remove a page   delete the line, or put // in front of it
       - a whole branch  use a * at the end, e.g. '/blog/*'
       - every page      set PAGES = null

     PER-PAGE INSTEAD OF SITE-WIDE
     The same snippet works pasted into ONE page's Custom Code footer
     (Page settings > Custom code > Footer). In that case set PAGES = null
     and the page it is pasted on is the only page it can appear on.

     WHY ONE PASTE AND NOT A COPY PER PAGE
     The Softr MCP cannot read or write custom code, page-level or site-wide.
     So every copy of this snippet is a place only Bev can edit: one copy means
     one edit when the wording, the link or the styling changes, twenty copies
     means twenty. A single shared vibe block would be the ideal, but Softr's
     shared blocks are headers and footers only (checked 2026-08-28, reusable
     arbitrary blocks are still an open feature request), so that is not on the
     table. A vibe block per page is pushable by MCP but costs a block slot on
     every page and twenty pushes per change.

     Reference version with the full commentary: website/new/home/cta-chips.html
     =========================================================================== -->

    // ---- Everything below is a switch, not a list ---------------------------
    // Hide the chips once someone is signed in. A signed-in visitor on the
    // homepage is already a customer, so the demo CTA is noise for them.
    HIDE_WHEN_SIGNED_IN: true,

    // Where each chip goes.
    DEMO_URL: '/book-call',
    CHAT_URL: '/book-a-demo',
  };
</script>

<style>

<script>
  (function () {
    var cfg = window.BL_CTA_CHIPS_CONFIG || {};
    var chips = document.getElementById('bl-cta-chips');
    if (!chips) return;

    // ---- Path matching ------------------------------------------------------
    // '/pricing' matches /pricing and /pricing/ and /pricing?x=1
    // '/blog/*'  matches /blog/anything
    function normalise(p) {
      p = String(p || '/').split('?')[0].split('#')[0];
      if (p.length > 1 && p.charAt(p.length - 1) === '/') p = p.slice(0, -1);
      return p.toLowerCase() || '/';
    }
    function onAllowedPage() {
      var list = cfg.PAGES;
      if (list === null || list === undefined) return true;   // every page
      if (!list.length) return false;                         // no pages
      var here = normalise(window.location.pathname);
      for (var i = 0; i < list.length; i++) {
        var rule = normalise(list[i]);
        if (rule.slice(-2) === '/*') {
          if (here === rule.slice(0, -2) || here.indexOf(rule.slice(0, -1)) === 0) return true;
        } else if (here === rule) {
          return true;
        }
      }
      return false;
    }

    // ---- Signed-in check ----------------------------------------------------
    // Softr fills logged_in_user asynchronously, so this is read repeatedly
    // rather than once. It only ever hides.
    function signedIn() {
      var u = window.logged_in_user;
      return !!(u && typeof u === 'object' && (u.softr_user_email || u.record_id || u.email || u.id));
    }

    var signedInSeen = false;
    function apply() {
      var show = onAllowedPage() && !(cfg.HIDE_WHEN_SIGNED_IN !== false && signedInSeen);
      chips.setAttribute('data-bl-state', show ? 'visible' : 'hidden');
    }

    apply();

    if (cfg.HIDE_WHEN_SIGNED_IN !== false) {
      var tries = 0;
      var poll = setInterval(function () {
        tries++;
        if (signedIn()) { signedInSeen = true; apply(); clearInterval(poll); }
        else if (tries >= 20) clearInterval(poll);   // 5s, then stop looking
      }, 250);
    }

    // ---- Re-check on navigation (Softr SPA mode) ----------------------------
    // In SPA mode the footer script runs once and the path changes underneath
    // it, so the page check has to run again on every route change.
    var lastPath = window.location.pathname;
    function onRouteChange() {
      if (window.location.pathname === lastPath) return;
      lastPath = window.location.pathname;
      apply();
    }
    ['pushState', 'replaceState'].forEach(function (m) {
      var orig = history[m];
      if (typeof orig !== 'function') return;
      history[m] = function () { var r = orig.apply(this, arguments); onRouteChange(); return r; };
    });
    window.addEventListener('popstate', onRouteChange);
    setInterval(onRouteChange, 400);

    // ---- Chip behaviour -----------------------------------------------------
    var demoUrl = cfg.DEMO_URL || '/book-call';
    var chatUrl = cfg.CHAT_URL || '/book-a-demo';

    var call = document.getElementById('bl-demo-chip');
    if (call) {
      call.setAttribute('href', demoUrl);
      // openSwModal is centred always, there is no placement argument.
      call.addEventListener('click', function (e) {
        if (typeof window.openSwModal === 'function') { e.preventDefault(); window.openSwModal(demoUrl, 'lg'); }
      });
    }

    var chat = document.getElementById('bl-chat-chip');
    if (chat) {
      chat.setAttribute('href', chatUrl);
      // Right side panel: renderer global -> URL params -> centred.
      chat.addEventListener('click', function (e) {
        var r = window.SoftrPageRenderer;
        if (r && typeof r.setOpenPageModal === 'function') {
          e.preventDefault(); r.setOpenPageModal({ src: chatUrl, size: 'M', placement: 'end' }); return;
        }
        try {
          var next = new URL(window.location.href);
          next.searchParams.set('modal', chatUrl);
          next.searchParams.set('modalSize', 'M');
          next.searchParams.set('modalPlacement', 'end');
          e.preventDefault(); window.location.href = next.toString(); return;
        } catch (err) { console.error('Side panel URL failed:', err); }
        if (typeof window.openSwModal === 'function') { e.preventDefault(); window.openSwModal(chatUrl, 'lg'); }
      });
    }
  })();
</script>
