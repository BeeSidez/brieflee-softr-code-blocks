<!-- ====================================================================
     Custom Code block: "Start your trial" chip (in-app home page)
     ====================================================================
     Discreet companion to /app/home/no-trial-empty — same visibility
     trigger (user has no Stripe customer / no active subscription) but
     a small floating chip instead of a full-page empty card. Use this
     when the home page already has content (existing workspaces /
     briefs / boards) and you don't want to wipe it out to nudge them
     to pick a plan.

     Click behaviour: opens /plan in a Softr modal (size: lg)
     via window.openSwModal. Matches the URL used by no-trial-empty
     (the plans + Stripe Embedded Checkout page). Falls back to plain
     anchor navigation if the helper isn't on window.

     Visibility: filter on Stripe customer ID / subscription status,
     same as no-trial-empty. Hide on every other page.

     SPA-safe — DOM lives inside this block's scope.
==================================================================== -->

<a
  href="/plan"
  class="bl-trial-chip"
  id="bl-trial-chip"
  aria-label="You haven't started your trial yet"
>
  <span class="bl-trial-chip-dot" aria-hidden="true"></span>
  <span class="bl-trial-chip-text">
    <span class="bl-trial-chip-title">You haven't started your trial yet</span>
    <span class="bl-trial-chip-sub">Pick a plan to get going</span>
  </span>
  <span class="bl-trial-chip-caret" aria-hidden="true">›</span>
</a>

<style>
  .bl-trial-chip {
    position: fixed;
    left: 20px;
    bottom: 20px;
    z-index: 9998;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px 9px 12px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow:
      0 10px 24px -8px rgba(0, 19, 100, 0.16),
      0 4px 10px -3px rgba(0, 19, 100, 0.08),
      0 0 0 1px rgba(0, 19, 100, 0.05);
    text-decoration: none !important;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    color: #001364;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    max-width: calc(100vw - 40px);
  }
  .bl-trial-chip:hover {
    transform: translateY(-2px);
    box-shadow:
      0 16px 32px -8px rgba(0, 19, 100, 0.22),
      0 6px 14px -3px rgba(0, 19, 100, 0.12),
      0 0 0 1px rgba(135, 156, 247, 0.4);
  }
  .bl-trial-chip:focus-visible {
    outline: 3px solid #879CF7;
    outline-offset: 2px;
  }

  /* Periwinkle status dot — keeps the chip feeling alive without an
     avatar. Subtle pulse so it doesn't read as a notification badge. */
  .bl-trial-chip-dot {
    flex-shrink: 0;
    width: 10px;
    height: 10px;
    border-radius: 999px;
    background: #879CF7;
    box-shadow: 0 0 0 4px rgba(135, 156, 247, 0.18);
    animation: bl-trial-chip-pulse 2.4s ease-in-out infinite;
  }
  @keyframes bl-trial-chip-pulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(135, 156, 247, 0.18); }
    50%      { box-shadow: 0 0 0 6px rgba(135, 156, 247, 0.28); }
  }

  .bl-trial-chip-text {
    display: flex;
    flex-direction: column;
    gap: 1px;
    line-height: 1.25;
    min-width: 0;
  }
  .bl-trial-chip-title {
    font-size: 13px;
    font-weight: 600;
    color: #001364;
    letter-spacing: -0.005em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bl-trial-chip-sub {
    font-size: 11.5px;
    font-weight: 500;
    color: #001364;
    opacity: 0.6;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bl-trial-chip-caret {
    font-size: 18px;
    line-height: 1;
    color: #879CF7;
    opacity: 0.6;
    transition: transform 0.18s ease, opacity 0.18s ease;
  }
  .bl-trial-chip:hover .bl-trial-chip-caret {
    transform: translateX(2px);
    opacity: 1;
  }

  @media (max-width: 480px) {
    .bl-trial-chip {
      left: 12px;
      bottom: 12px;
      padding: 8px 12px 8px 10px;
      gap: 8px;
    }
    .bl-trial-chip-title { font-size: 12.5px; }
    .bl-trial-chip-sub   { font-size: 11px; }
  }
</style>

<script type="module">
  // Open /plan as a Softr modal. Falls back to the anchor's href
  // navigation if openSwModal isn't available.
  const chip = document.getElementById('bl-trial-chip');
  if (chip) {
    chip.addEventListener('click', (e) => {
      if (typeof window !== 'undefined' && typeof window.openSwModal === 'function') {
        e.preventDefault();
        window.openSwModal('/plan', 'lg');
      }
    });
  }
</script>
